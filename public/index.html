<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuthPro — Secure Authentication</title>
  <meta name="description" content="Professional authentication system">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Animated Background -->
<div class="bg-animation">
  <div class="gradient-sphere sphere-1"></div>
  <div class="gradient-sphere sphere-2"></div>
  <div class="gradient-sphere sphere-3"></div>
</div>

<div class="container">
  <div class="auth-card">
    <!-- Header -->
    <div class="auth-header">
      <div class="logo">
        <svg viewBox="0 0 40 40" class="logo-icon">
          <defs>
            <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#6366f1"/>
              <stop offset="100%" stop-color="#8b5cf6"/>
            </linearGradient>
          </defs>
          <path d="M20 3L5 10v8c0 9.94 6.4 19.23 15 22 8.6-2.77 15-12.06 15-22v-8L20 3zm-2 30.93C11.07 31.4 7 23.63 7 18v-6.26L20 5.68l13 6.06V18c0 5.63-4.07 13.4-11 15.93V33.93z" fill="url(#logoGrad)"/>
          <path d="M18 22l-4-4 1.41-1.41L18 19.17l6.59-6.59L26 14l-8 8z" fill="url(#logoGrad)"/>
        </svg>
        <span class="logo-text">Auth<span class="logo-accent">Pro</span></span>
      </div>
      <p class="auth-subtitle">Secure authentication for modern apps</p>
    </div>

    <!-- Tabs -->
    <div class="tab-nav tab-nav-4">
      <button class="tab-btn active" data-tab="login" id="tab-login">Sign In</button>
      <button class="tab-btn" data-tab="register" id="tab-register">Sign Up</button>
      <button class="tab-btn" data-tab="phone" id="tab-phone">Phone</button>
      <button class="tab-btn" data-tab="email-otp" id="tab-email-otp">Email</button>
      <div class="tab-indicator"></div>
    </div>

    <!-- Login Form -->
    <div class="tab-content active" id="login-form">
      <form id="loginForm" novalidate>
        <div class="form-group">
          <input type="email" id="login-email" placeholder=" " required autocomplete="email">
          <label for="login-email">Email Address</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 4 10 8 10-8"/></svg>
          </div>
        </div>
        <div class="form-group">
          <input type="password" id="login-password" placeholder=" " required autocomplete="current-password">
          <label for="login-password">Password</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <button type="button" class="toggle-password" data-target="login-password" aria-label="Toggle password visibility">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <button type="submit" class="btn btn-primary" id="login-btn">
          <span class="btn-text">Sign In</span>
          <div class="btn-loader"></div>
        </button>
      </form>
    </div>

    <!-- Register Form -->
    <div class="tab-content" id="register-form">
      <form id="registerForm" novalidate>
        <div class="form-group">
          <input type="text" id="register-name" placeholder=" " required autocomplete="name">
          <label for="register-name">Full Name</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
          </div>
        </div>
        <div class="form-group">
          <input type="email" id="register-email" placeholder=" " required autocomplete="email">
          <label for="register-email">Email Address</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 4 10 8 10-8"/></svg>
          </div>
        </div>
        <div class="form-group">
          <input type="password" id="register-password" placeholder=" " required autocomplete="new-password">
          <label for="register-password">Password</label>
          <div class="input-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
          </div>
          <button type="button" class="toggle-password" data-target="register-password" aria-label="Toggle password visibility">
            <svg class="eye-open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="eye-closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
          </button>
        </div>
        <div class="password-strength">
          <div class="strength-bars">
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
            <div class="strength-bar"></div>
          </div>
          <span class="strength-text"></span>
        </div>
        <button type="submit" class="btn btn-primary" id="register-btn">
          <span class="btn-text">Create Account</span>
          <div class="btn-loader"></div>
        </button>
      </form>
    </div>

    <!-- Phone OTP Form -->
    <div class="tab-content" id="phone-form">
      <div id="otp-step-phone">
        <form id="phoneForm" novalidate>
          <!-- Channel selector: SMS or WhatsApp -->
          <div class="channel-selector">
            <button type="button" class="channel-btn active" data-channel="sms" id="channel-sms">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 4 10 8 10-8"/></svg>
              SMS
            </button>
            <button type="button" class="channel-btn" data-channel="whatsapp" id="channel-whatsapp">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              WhatsApp
            </button>
          </div>
          <div class="form-group">
            <input type="tel" id="phone-number" placeholder=" " required autocomplete="tel">
            <label for="phone-number">Phone Number (e.g. +1234567890)</label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="send-otp-btn">
            <span class="btn-text">Send OTP Code</span>
            <div class="btn-loader"></div>
          </button>
        </form>
      </div>
      <div id="otp-step-verify" style="display: none;">
        <div class="otp-info">
          <p>Enter the 6-digit code sent to</p>
          <p class="otp-phone-display" id="otp-phone-display"></p>
        </div>
        <form id="otpVerifyForm" novalidate>
          <div class="otp-inputs" id="otp-inputs">
            <input type="text" maxlength="1" class="otp-digit" data-index="0" inputmode="numeric" autocomplete="one-time-code">
            <input type="text" maxlength="1" class="otp-digit" data-index="1" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-digit" data-index="2" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-digit" data-index="3" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-digit" data-index="4" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-digit" data-index="5" inputmode="numeric">
          </div>
          <div class="otp-timer">
            <span id="otp-timer-text">Resend in <span id="otp-countdown">60</span>s</span>
            <button type="button" class="btn-link" id="resend-otp-btn" style="display: none;">Resend Code</button>
          </div>
          <button type="submit" class="btn btn-primary" id="verify-otp-btn">
            <span class="btn-text">Verify & Sign In</span>
            <div class="btn-loader"></div>
          </button>
        </form>
        <button type="button" class="btn-link change-phone-link" id="change-phone-btn">← Change phone number</button>
      </div>
    </div>

    <!-- Email OTP Form -->
    <div class="tab-content" id="email-otp-form">
      <div id="email-otp-step-email">
        <form id="emailOtpForm" novalidate>
          <div class="form-group">
            <input type="email" id="email-otp-input" placeholder=" " required autocomplete="email">
            <label for="email-otp-input">Email Address</label>
            <div class="input-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 4 10 8 10-8"/></svg>
            </div>
          </div>
          <button type="submit" class="btn btn-primary" id="send-email-otp-btn">
            <span class="btn-text">Send Verification Code</span>
            <div class="btn-loader"></div>
          </button>
        </form>
      </div>
      <div id="email-otp-step-verify" style="display: none;">
        <div class="otp-info">
          <p>Enter the 6-digit code sent to</p>
          <p class="otp-phone-display" id="email-otp-display"></p>
        </div>
        <form id="emailOtpVerifyForm" novalidate>
          <div class="otp-inputs" id="email-otp-inputs">
            <input type="text" maxlength="1" class="otp-digit email-otp-digit" data-index="0" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-digit email-otp-digit" data-index="1" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-digit email-otp-digit" data-index="2" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-digit email-otp-digit" data-index="3" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-digit email-otp-digit" data-index="4" inputmode="numeric">
            <input type="text" maxlength="1" class="otp-digit email-otp-digit" data-index="5" inputmode="numeric">
          </div>
          <div class="otp-timer">
            <span id="email-otp-timer-text">Resend in <span id="email-otp-countdown">60</span>s</span>
            <button type="button" class="btn-link" id="resend-email-otp-btn" style="display: none;">Resend Code</button>
          </div>
          <button type="submit" class="btn btn-primary" id="verify-email-otp-btn">
            <span class="btn-text">Verify & Sign In</span>
            <div class="btn-loader"></div>
          </button>
        </form>
        <button type="button" class="btn-link change-phone-link" id="change-email-btn">← Change email</button>
      </div>
    </div>

    <!-- Divider -->
    <div class="divider">
      <span>or continue with</span>
    </div>

    <!-- Google Button -->
    <div class="social-login">
      <button class="btn btn-google" id="google-login-btn">
        <svg viewBox="0 0 24 24" width="20" height="20">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92a5.06 5.06 0 0 1-2.2 3.32v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.1z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </div>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script src="js/auth.js"></script>
<script src="js/otp.js"></script>
</body>
</html>
