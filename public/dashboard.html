<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prime Stack — Dashboard</title>
  <meta name="description" content="Prime Stack user dashboard">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- Animated Background -->
<div class="bg-animation">
  <div class="gradient-sphere sphere-1"></div>
  <div class="gradient-sphere sphere-2"></div>
  <div class="gradient-sphere sphere-3"></div>
</div>

<div class="container">
  <div class="dashboard-card">
    <!-- Dashboard Header -->
    <div class="dashboard-header">
      <div class="dashboard-welcome">
        <span class="welcome-label">Welcome back,</span>
        <h1 class="user-name" id="user-name">Loading...</h1>
      </div>
      <div class="user-avatar" id="user-avatar">
        <span>...</span>
      </div>
    </div>

    <!-- User Info Grid -->
    <div class="user-info-grid">
      <div class="info-item">
        <div class="info-label">Full Name</div>
        <div class="info-value" id="info-name">—</div>
      </div>
      <div class="info-item">
        <div class="info-label">Email Address</div>
        <div class="info-value" id="info-email">—</div>
      </div>
      <div class="info-item">
        <div class="info-label">Phone Number</div>
        <div class="info-value" id="info-phone">—</div>
      </div>
      <div class="info-item">
        <div class="info-label">Auth Provider</div>
        <div class="info-value" id="info-provider">—</div>
      </div>
      <div class="info-item">
        <div class="info-label">Member Since</div>
        <div class="info-value" id="info-member-since">—</div>
      </div>
      <div class="info-item">
        <div class="info-label">Account ID</div>
        <div class="info-value" id="info-id">—</div>
      </div>
    </div>

    <!-- Logout Button -->
    <button class="btn btn-logout" id="logout-btn">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
      <span>Sign Out</span>
    </button>
  </div>
</div>

<!-- Toast Container -->
<div class="toast-container" id="toast-container"></div>

<script src="js/app.js"></script>
</body>
</html>
